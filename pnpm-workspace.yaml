packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - prisma

# Versões corrigidas de dependências transitivas com alertas de segurança
# (pnpm audit). Nenhuma era explorável em runtime, mas o audit fica limpo.
overrides:
  deepmerge-ts: ^8.0.0
  esbuild: ^0.28.1
  js-yaml@>=5.0.0 <5.4.1: ^5.4.1
  mysql2: ^3.23.1
