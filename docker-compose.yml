services:
  db:
    image: postgres:16-alpine
    container_name: hospital_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hospital}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hospital123}
      POSTGRES_DB: ${POSTGRES_DB:-hospital_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hospital} -d ${POSTGRES_DB:-hospital_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: hospital_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # A partir daqui é com você! Adicione neste arquivo os serviços da sua
  # aplicação (API Node e frontend React), para que todo o ambiente suba com
  # um único comando: `docker compose up`.
  #
  # Sugestão de esqueleto para o serviço de API:
  #
  # api:
  #   build: ./api
  #   container_name: hospital_api
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-hospital123}@db:5432/${POSTGRES_DB:-hospital_db}
  #   ports:
  #     - "3001:3001"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #
  # web:
  #   build: ./web
  #   container_name: hospital_web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api
  # --------------------------------------------------------------------------

volumes:
  pgdata:
