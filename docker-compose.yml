services:
  db:
    image: postgres:16-alpine
    container_name: hospital_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env (veja .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env (veja .env.example)}
    ports:
      - "${POSTGRES_PORT:?Defina POSTGRES_PORT no .env (veja .env.example)}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ usa as variáveis do próprio container, sem repetir a interpolação
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: hospital_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:?Defina ADMINER_PORT no .env (veja .env.example)}:8080"
    depends_on:
      db:
        condition: service_healthy

  # --------------------------------------------------------------------------
  # A partir daqui é com você! Adicione neste arquivo os serviços da sua
  # aplicação (API Node e frontend React), para que todo o ambiente suba com
  # um único comando: `docker compose up`.
  #
  # Sugestão de esqueleto para o serviço de API:
  #
  # api:
  #   build: ./api
  #   container_name: hospital_api
  #   restart: unless-stopped
  #   environment:
  #     DATABASE_URL: postgres://${POSTGRES_USER:-hospital}:${POSTGRES_PASSWORD:-hospital123}@db:5432/${POSTGRES_DB:-hospital_db}
  #   ports:
  #     - "3001:3001"
  #   depends_on:
  #     db:
  #       condition: service_healthy
  #
  # web:
  #   build: ./web
  #   container_name: hospital_web
  #   restart: unless-stopped
  #   ports:
  #     - "3000:3000"
  #   depends_on:
  #     - api
  # --------------------------------------------------------------------------

volumes:
  pgdata:
