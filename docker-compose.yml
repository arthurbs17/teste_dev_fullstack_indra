services:
  db:
    image: postgres:16-alpine
    container_name: hospital_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Defina POSTGRES_USER no .env (veja .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?Defina POSTGRES_DB no .env (veja .env.example)}
    ports:
      - "${POSTGRES_PORT:?Defina POSTGRES_PORT no .env (veja .env.example)}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ usa as variáveis do próprio container, sem repetir a interpolação
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer:latest
    container_name: hospital_adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT:?Defina ADMINER_PORT no .env (veja .env.example)}:8080"
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: hospital_api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:?Defina POSTGRES_USER no .env (veja .env.example)}:${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD no .env (veja .env.example)}@db:5432/${POSTGRES_DB:?Defina POSTGRES_DB no .env (veja .env.example)}
      API_PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-600}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
    ports:
      - "${API_PORT:?Defina API_PORT no .env (veja .env.example)}:3001"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: hospital_web
    restart: unless-stopped
    environment:
      # O servidor do web chama a API pela rede interna do compose; o
      # navegador nunca acessa a API diretamente.
      API_URL: http://api:3001
    ports:
      - "${WEB_PORT:?Defina WEB_PORT no .env (veja .env.example)}:3000"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
